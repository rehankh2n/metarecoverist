<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | Meta Recoverist</title>
<style>
:root{--bg:#080b0d;--panel:#101419;--text:#f4f7f5;--muted:#9aa3a7;--green:#b8ff38;--green2:#63f29b;--line:rgba(184,255,56,.2)}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,rgba(184,255,56,.1),transparent 30%),radial-gradient(circle at 85% 80%,rgba(0,255,180,.08),transparent 30%),var(--bg)}
.card{width:min(440px,100%);padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(16,20,25,.94);box-shadow:0 25px 80px rgba(0,0,0,.45)}
.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--green2));color:#071006;font-weight:950;font-size:22px;margin-bottom:22px}.brand{font-weight:900;font-size:18px}.brand b{color:var(--green)}h1{font-size:36px;letter-spacing:-1.5px;margin:25px 0 8px}.muted{color:var(--muted);font-size:14px;margin-bottom:25px}.field{margin:15px 0}.field label{display:block;font-size:12px;color:#c8d0cc;margin-bottom:7px}.field input{width:100%;padding:14px;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:#0b0f12;color:white;outline:none}.field input:focus{border-color:var(--green)}button{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--green2));color:#071006;font-weight:900;font-size:15px;cursor:pointer;margin-top:8px}.back{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:18px;text-decoration:none}.note{font-size:11px;color:#7f898d;text-align:center;margin-top:18px;line-height:1.5}.error{display:none;color:#ff8d8d;font-size:12px;margin-top:12px}.success{display:none;color:var(--green);font-size:12px;margin-top:12px}
</style></head><body><main class="card"><div class="logo">MR</div><div class="brand">META <b>RECOVERIST</b></div><h1>Welcome back.</h1><p class="muted">Sign in to your client account.</p><form id="loginForm" action="/login" method="POST"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required placeholder="you@example.com" value="mafiahun@outlook.com"></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div><button type="submit">Login →</button><div id="msg" class="error">Login could not be completed. Connect this form to your authentication backend.</div></form><a class="back" href="index.html">← Back to website</a><p class="note">Your login email is prefilled. For security, the password is checked server-side and is not stored in this HTML file.</p></main></body></html>
